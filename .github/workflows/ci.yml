name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - name: Validate the service catalog
        run: python scripts/validate_catalog.py
      - name: Unit tests
        run: python -m pytest -q tests

  terraform:
    name: Terraform ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/service-monitors
          - modules/service-slo
          - modules/service-dashboard
          - live
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Validate
        run: |
          terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
          terraform -chdir=${{ matrix.dir }} validate

  # Datadog checks monitor queries during plan, so a real plan is the only
  # way to catch a bad query. It runs on pull requests from this repository
  # when the keys are configured, and is skipped otherwise.
  plan:
    name: Plan against Datadog
    needs: [catalog, terraform]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PLAN_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      BACKEND_BUCKET: ${{ vars.STATE_BUCKET }}
      BACKEND_REGION: ${{ vars.STATE_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.BACKEND_REGION }}
      - name: Plan
        working-directory: live
        run: |
          terraform init -input=false \
            -backend-config="bucket=${BACKEND_BUCKET}" \
            -backend-config="key=observability/terraform.tfstate" \
            -backend-config="region=${BACKEND_REGION}" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -lock=false
